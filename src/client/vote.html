<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <title>audia · vote</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./vote.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" width="34" height="34" role="img" aria-label="audia">
        <title>audia</title>
        <defs>
          <linearGradient id="audia-logo-g" gradientUnits="userSpaceOnUse" x1="2" y1="3" x2="30" y2="30">
            <stop offset="0" stop-color="#ff4f7b" />
            <stop offset="1" stop-color="#7b5cff" />
          </linearGradient>
        </defs>
        <g fill="url(#audia-logo-g)">
          <path d="M10.2 7.6 28.8 3.2v4.6L10.2 12.2z" />
          <rect x="10.2" y="9" width="2.6" height="10.4" />
          <rect x="26.2" y="5" width="2.6" height="10.4" />
          <circle cx="8.6" cy="19.4" r="4.2" />
          <path d="M1.6 30.6c0-4.4 3.2-6 7-6s7 1.6 7 6z" />
          <circle cx="24.6" cy="15.4" r="4.2" />
          <path d="M17.6 26.6c0-4.4 3.2-6 7-6s7 1.6 7 6z" />
        </g>
      </svg>
        <span id="status" class="status" data-status="starting">starting…</span>
      </div>
      <div id="round" class="round"></div>
    </header>

    <form id="search-form" class="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search YouTube Music…" enterkeyhint="search" />
      <button id="clear" type="button" class="clear" hidden aria-label="Clear search">✕</button>
    </form>

    <main>
      <section id="ended" class="ended" hidden>
        <div class="ended-title">That's a wrap!</div>
        <p class="muted">The session has ended. Thanks for voting!</p>
        <h2>Played tonight</h2>
        <ul id="ended-list" class="songs compact"></ul>
      </section>

      <section id="results" hidden>
        <h2>Results</h2>
        <ul id="result-list" class="songs"></ul>
      </section>

      <section id="voting">
        <div class="section-head">
          <h2>Vote</h2>
          <span id="votes-left" class="pill-small"></span>
        </div>
        <ul id="candidate-list" class="songs"></ul>
        <p id="empty" class="empty" hidden>No songs yet. Search above to propose one.</p>
      </section>

      <section id="next-section" hidden>
        <h2>Up next</h2>
        <ul id="next-list" class="songs compact"></ul>
      </section>
    </main>

    <footer id="now" class="now" hidden>
      <img id="now-thumb" alt="" />
      <div class="now-meta">
        <div id="now-title" class="title"></div>
        <div id="now-artist" class="artist"></div>
        <div class="bar"><div id="now-bar"></div></div>
      </div>
      <button id="skip" class="skip-btn" type="button" aria-label="Vote to skip">
        <svg class="skip-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5 5.5v13l9-6.5-9-6.5zm10 0v13h2.5v-13H15z"/></svg><span id="skip-count" class="skip-count"></span>
      </button>
    </footer>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./vote.ts"></script>
  </body>
</html>
